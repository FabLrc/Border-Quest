name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Extract version from tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          echo "MOD_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build
        run: .\gradlew.bat build -Pmod_version="$env:MOD_VERSION"

      - name: Extract changelog for this version
        shell: pwsh
        run: |
          $v = $env:MOD_VERSION
          $escaped = $v -replace '\.', '\.'
          $content = Get-Content CHANGELOG.md -Raw
          $pattern = "## \[$escaped\].*?(?=\r?\n## \[|\z)"
          $match = [regex]::Match($content, $pattern, [System.Text.RegularExpressions.RegexOptions]::Singleline)
          if ($match.Success) {
            $match.Value.Trim() | Set-Content release_body.md
          } else {
            "Border Quest v$v" | Set-Content release_body.md
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ env.MOD_VERSION }}"
          body_path: release_body.md
          files: build/libs/*.jar
          draft: false
          prerelease: true

      - name: Publish to Modrinth
        run: .\gradlew.bat modrinth -Pmod_version="$env:MOD_VERSION"
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Compile Check
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build
        run: .\gradlew.bat build
